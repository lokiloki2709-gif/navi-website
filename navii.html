<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>You Are Special 💗</title>

<style>

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    height: 100vh;
    overflow: hidden;
    font-family: Arial, sans-serif;

    background: linear-gradient(
        135deg,
        #fff0f6,
        #ffd6e7,
        #ffeaf2
    );
}

.container {
    width: 100%;
    height: 100vh;
    text-align: center;
    padding-top: 70px;
}

h1 {
    color: #d6336c;
    font-size: 27px;
    margin-bottom: 55px;
}


/* BALLOON AREA */

.balloon-area {
    width: 330px;
    margin: auto;

    display: grid;
    grid-template-columns: 1fr 1fr;

    gap: 55px 45px;
}


/* BALLOON BOX */

.balloon-box {
    position: relative;

    width: 120px;
    height: 140px;

    margin: auto;

    cursor: pointer;
}


/* BALLOON */

.balloon {
    position: absolute;

    width: 80px;
    height: 100px;

    left: 20px;
    top: 0;

    border-radius: 50%;

    box-shadow:
        inset -10px -10px 15px rgba(0,0,0,0.08),
        inset 8px 8px 12px rgba(255,255,255,0.55);

    z-index: 2;
}


/* BALLOON COLORS */

.blue {
    background: #9ed9ef;
}

.pink {
    background: #f3b5ca;
}

.green {
    background: #a7dfc1;
}

.purple {
    background: #b9ace9;
}


/* STRING */

.string {
    position: absolute;

    width: 2px;
    height: 35px;

    background: #999;

    left: 59px;
    top: 98px;

    z-index: 1;
}


/* RIBBON */

.knot {
    position: absolute;

    left: 50px;
    top: 92px;

    font-size: 17px;

    z-index: 3;
}


/* WORD */

.word {
    position: absolute;

    width: 120px;

    left: 0;
    top: 35px;

    color: #c92f68;

    font-size: 25px;
    font-family: cursive;

    opacity: 0;

    transform: scale(0.3);

    transition: all 0.45s ease;

    z-index: 10;

    pointer-events: none;
}

.word.show {
    opacity: 1;

    transform: scale(1);
}


/* BALLOON POP */

.pop {
    animation: balloonPop 0.3s forwards;
}

@keyframes balloonPop {

    0% {
        transform: scale(1);
        opacity: 1;
    }

    50% {
        transform: scale(1.3);
        opacity: 0.8;
    }

    100% {
        transform: scale(0);
        opacity: 0;
    }
}


/* BLAST RING */

.blast-ring {
    position: absolute;

    width: 30px;
    height: 30px;

    left: 45px;
    top: 35px;

    border: 4px solid #ffffff;

    border-radius: 50%;

    opacity: 0;

    z-index: 5;

    pointer-events: none;
}

.blast-ring.active {
    animation: blastRing 0.45s ease-out;
}

@keyframes blastRing {

    0% {
        width: 20px;
        height: 20px;

        left: 50px;
        top: 40px;

        opacity: 1;
    }

    100% {
        width: 120px;
        height: 120px;

        left: 0;
        top: -10px;

        opacity: 0;
    }
}


/* PARTICLES */

.particle {
    position: absolute;

    width: 8px;
    height: 8px;

    border-radius: 50%;

    left: 56px;
    top: 45px;

    z-index: 8;

    pointer-events: none;
}

.particle.active {
    animation: particleBlast 0.65s ease-out forwards;
}

@keyframes particleBlast {

    0% {
        transform: translate(0,0) scale(1);
        opacity: 1;
    }

    100% {
        transform:
            translate(
                var(--x),
                var(--y)
            )
            scale(0);

        opacity: 0;
    }
}


/* STAR */

.star {
    position: absolute;

    left: 52px;
    top: 35px;

    color: white;

    font-size: 20px;

    z-index: 9;

    opacity: 0;

    pointer-events: none;
}

.star.active {
    animation: starBlast 0.6s ease-out forwards;
}

@keyframes starBlast {

    0% {
        transform: scale(0);
        opacity: 1;
    }

    100% {
        transform:
            translate(
                var(--x),
                var(--y)
            )
            scale(1.4);

        opacity: 0;
    }
}


/* NEXT BUTTON */

.next-btn {
    display: none;

    margin: 20px auto 0;

    padding: 12px 30px;

    border: none;

    border-radius: 25px;

    background: #e75480;

    color: white;

    font-size: 17px;

    font-weight: bold;

    cursor: pointer;

    box-shadow:
        0 5px 15px
        rgba(200,60,110,0.3);
}

.next-btn:hover {
    background: #d63d6d;
    transform: scale(1.05);
}

</style>
</head>


<body>

<div class="container">

    <h1 id="title">
        Pop all 4 balloons
    </h1>


    <div class="balloon-area">


        <!-- BALLOON 1 -->

        <div class="balloon-box"
             onclick="popBalloon(this,'you')">

            <div class="balloon blue"></div>

            <div class="knot">🎀</div>

            <div class="string"></div>

            <div class="blast-ring"></div>

            <div class="word" id="you">
                You
            </div>

        </div>


        <!-- BALLOON 2 -->

        <div class="balloon-box"
             onclick="popBalloon(this,'are')">

            <div class="balloon pink"></div>

            <div class="knot">🎀</div>

            <div class="string"></div>

            <div class="blast-ring"></div>

            <div class="word" id="are">
                are
            </div>

        </div>


        <!-- BALLOON 3 -->

        <div class="balloon-box"
             onclick="popBalloon(this,'so')">

            <div class="balloon green"></div>

            <div class="knot">🎀</div>

            <div class="string"></div>

            <div class="blast-ring"></div>

            <div class="word" id="so">
                so
            </div>

        </div>


        <!-- BALLOON 4 -->

        <div class="balloon-box"
             onclick="popBalloon(this,'special')">

            <div class="balloon purple"></div>

            <div class="knot">🎀</div>

            <div class="string"></div>

            <div class="blast-ring"></div>

            <div class="word" id="special">
                special
            </div>

        </div>

    </div>


    <button
        class="next-btn"
        id="nextBtn"
        onclick="nextPage()">

        Next ➜

    </button>

</div>


<script>

let popped = 0;


/* POP FUNCTION */

function popBalloon(box, wordId) {

    /* Prevent double click */

    if (box.classList.contains("done")) {
        return;
    }

    box.classList.add("done");


    /* Balloon */

    const balloon =
        box.querySelector(".balloon");


    /* Blast ring */

    const ring =
        box.querySelector(".blast-ring");


    /* POP */

    balloon.classList.add("pop");


    /* Ring effect */

    ring.classList.add("active");


    /* Create particles */

    createParticles(box);


    /* Create stars */

    createStars(box);


    /* Count */

    popped++;


    /* Show word */

    setTimeout(function() {

        document
            .getElementById(wordId)
            .classList.add("show");

    }, 180);


    /* After all balloons */

    if (popped === 4) {

        setTimeout(function() {

            document
                .getElementById("nextBtn")
                .style.display = "block";

        }, 700);

    }

}


/* PARTICLES */

function createParticles(box) {

    for (let i = 0; i < 14; i++) {

        const particle =
            document.createElement("div");

        particle.className = "particle";


        /* Random direction */

        const angle =
            Math.random() * Math.PI * 2;

        const distance =
            45 + Math.random() * 45;

        const x =
            Math.cos(angle) * distance;

        const y =
            Math.sin(angle) * distance;


        particle.style.setProperty(
            "--x",
            x + "px"
        );

        particle.style.setProperty(
            "--y",
            y + "px"
        );


        /* Random particle size */

        const size =
            5 + Math.random() * 7;

        particle.style.width =
            size + "px";

        particle.style.height =
            size + "px";


        /* Random colors */

        const colors = [
            "#ff6f91",
            "#ffb6c1",
            "#ffd166",
            "#ffffff",
            "#cdb4db"
        ];

        particle.style.background =
            colors[
                Math.floor(
                    Math.random() * colors.length
                )
            ];


        box.appendChild(particle);


        setTimeout(function() {

            particle.classList.add("active");

        }, 10);


        setTimeout(function() {

            particle.remove();

        }, 700);

    }

}


/* STARS */

function createStars(box) {

    for (let i = 0; i < 5; i++) {

        const star =
            document.createElement("div");

        star.className = "star";

        star.innerHTML = "✦";


        const angle =
            Math.random() * Math.PI * 2;

        const distance =
            50 + Math.random() * 50;

        const x =
            Math.cos(angle) * distance;

        const y =
            Math.sin(angle) * distance;


        star.style.setProperty(
            "--x",
            x + "px"
        );

        star.style.setProperty(
            "--y",
            y + "px"
        );


        box.appendChild(star);


        setTimeout(function() {

            star.classList.add("active");

        }, 10);


        setTimeout(function() {

            star.remove();

        }, 700);

    }

}


/* NEXT PAGE */

function nextPage() {

    window.location.href = "naviii.html";

}

</script>

</body>
</html>
