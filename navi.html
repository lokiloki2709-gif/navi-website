<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Happy Birthday</title>

<style>

/* ================= GENERAL ================= */

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    padding: 0;
    min-height: 100vh;
    background: #f8dfe4;
    font-family: Georgia, serif;
    overflow-x: hidden;
}

.container {
    width: 100%;
    max-width: 450px;
    min-height: 100vh;
    margin: auto;
    padding: 55px 20px 40px;
    text-align: center;
    position: relative;
}


/* ================= TITLE ================= */

.title {
    font-family: cursive;
    font-size: 42px;
    color: #3c2929;
    margin: 0;
}

.name {
    margin-top: 5px;
    font-family: Arial, sans-serif;
    font-size: 40px;
    font-weight: bold;
    letter-spacing: 2px;
    color: #d41462;
}


/* ================= DECORATIONS ================= */

.decorations {
    margin-top: 30px;
    position: relative;
    height: 55px;
}

/* Hanging line */

.string {
    position: absolute;
    width: 90%;
    height: 3px;
    background: #49312d;
    left: 5%;
    top: 20px;
    transform: rotate(-2deg);
}

/* Flags */

.flag {
    position: absolute;
    top: 21px;
    width: 0;
    height: 0;
    border-left: 17px solid transparent;
    border-right: 17px solid transparent;
    border-top: 28px solid;
}

.f1 {
    left: 8%;
    border-top-color: #f05c82;
}

.f2 {
    left: 25%;
    border-top-color: #72d66b;
}

.f3 {
    left: 42%;
    border-top-color: #ffd45c;
}

.f4 {
    left: 59%;
    border-top-color: #61d5c5;
}

.f5 {
    left: 76%;
    border-top-color: #f05c82;
}

.f6 {
    left: 89%;
    border-top-color: #8edc69;
}


/* ================= CHARACTERS ================= */

.characters {
    display: flex;
    justify-content: center;
    align-items: flex-end;
    gap: 3px;
    margin-top: 5px;
    height: 330px;
}


/* ================= BEAR ================= */

.bear {
    width: 155px;
    height: 225px;
    background: #c9925b;
    border: 4px solid #4a302b;
    border-radius: 75px 75px 60px 60px;
    position: relative;
    z-index: 2;
}


/* Bear ears */

.bear-ear {
    width: 48px;
    height: 48px;
    background: #c9925b;
    border: 4px solid #4a302b;
    border-radius: 50%;
    position: absolute;
    top: -15px;
}

.bear-ear.ear1 {
    left: 5px;
}

.bear-ear.ear2 {
    right: 5px;
}


/* Bear eyes */

.eye {
    width: 13px;
    height: 18px;
    background: #30201e;
    border-radius: 50%;
    position: absolute;
    top: 82px;
}

.bear .eye1 {
    left: 43px;
}

.bear .eye2 {
    right: 43px;
}


/* Bear mouth */

.bear-mouth {
    position: absolute;
    top: 103px;
    left: 50%;
    transform: translateX(-50%);
    font-size: 25px;
    color: #30201e;
}


/* Bear cheeks */

.bear-cheek {
    position: absolute;
    width: 32px;
    height: 24px;
    background: #f4c85d;
    border-radius: 50%;
    top: 112px;
}

.bear-cheek.cheek1 {
    left: 12px;
}

.bear-cheek.cheek2 {
    right: 12px;
}


/* ================= BUNNY ================= */

.bunny {
    width: 155px;
    height: 225px;
    background: #eaf5ee;
    border: 4px solid #4a302b;
    border-radius: 75px 75px 60px 60px;
    position: relative;
    z-index: 1;
}


/* Bunny ears */

.bunny-ear {
    width: 43px;
    height: 82px;
    background: #eaf5ee;
    border: 4px solid #4a302b;
    border-radius: 50%;
    position: absolute;
    top: -67px;
}

.bunny-ear.ear1 {
    left: 35px;
    transform: rotate(-10deg);
}

.bunny-ear.ear2 {
    right: 35px;
    transform: rotate(10deg);
}


/* Bunny eyes */

.bunny .eye1 {
    left: 43px;
}

.bunny .eye2 {
    right: 43px;
}


/* Bunny mouth */

.bunny-mouth {
    position: absolute;
    top: 103px;
    left: 50%;
    transform: translateX(-50%);
    font-size: 25px;
    color: #30201e;
}


/* Bunny cheeks */

.bunny-cheek {
    position: absolute;
    width: 32px;
    height: 24px;
    background: #efb7aa;
    border-radius: 50%;
    top: 112px;
}

.bunny-cheek.cheek1 {
    left: 12px;
}

.bunny-cheek.cheek2 {
    right: 12px;
}


/* ================= CAKE ================= */

.cake {
    position: absolute;
    width: 165px;
    left: 75px;
    bottom: 18px;
    z-index: 5;
}


/* Cake top */

.cake-top {
    width: 135px;
    height: 38px;
    margin: auto;
    background: white;
    border: 3px solid #563b35;
    border-radius: 50%;
}


/* Cake body */

.cake-body {
    width: 150px;
    height: 65px;
    margin: -5px auto 0;

    background: #f29ca5;
    border: 3px solid #563b35;
    border-radius: 8px 8px 25px 25px;

    display: flex;
    justify-content: center;
    align-items: center;

    color: #a52b57;
    font-family: Arial, sans-serif;
    font-size: 17px;
    font-weight: bold;
    line-height: 21px;
}


/* Candle */

.candle {
    position: absolute;
    width: 12px;
    height: 45px;
    background: #b9eee0;
    border: 2px solid #555;
    left: 50%;
    top: -42px;
    transform: translateX(-50%);
}


/* Flame */

.flame {
    position: absolute;
    left: 50%;
    top: -75px;
    transform: translateX(-50%);
    font-size: 23px;
}


/* ================= QUESTION ================= */

.question {
    margin-top: 45px;
    font-size: 25px;
    font-weight: bold;
    color: #302525;
    line-height: 1.3;
}


/* ================= BUTTONS ================= */

.buttons {
    display: flex;
    justify-content: center;
    gap: 25px;
    margin-top: 28px;
}

button {
    width: 150px;
    height: 65px;
    border-radius: 18px;
    border: none;
    font-size: 21px;
    font-family: Georgia, serif;
    cursor: pointer;
    transition: 0.3s;
}

.yes {
    background: #e00072;
    color: white;
    box-shadow: 0 5px 15px rgba(150, 50, 90, 0.25);
}

.no {
    background: #fffafa;
    color: #333;
    box-shadow: 0 5px 15px rgba(150, 50, 90, 0.20);
}

button:hover {
    transform: scale(1.06);
}


/* ================= MESSAGE ================= */

#message {
    margin-top: 25px;
    font-size: 21px;
    font-weight: bold;
    color: #d41462;
}


/* ================= FLOATING DECORATIONS ================= */

.star,
.flower,
.heart {
    position: absolute;
    font-size: 28px;
    animation: float 3s ease-in-out infinite;
}

.star1 {
    top: 480px;
    left: 35px;
}

.star2 {
    top: 500px;
    right: 30px;
}

.flower1 {
    top: 600px;
    left: 20px;
}

.flower2 {
    top: 570px;
    right: 25px;
}

.heart {
    top: 535px;
    left: 50%;
}

@keyframes float {

    0% {
        transform: translateY(0);
    }

    50% {
        transform: translateY(-10px);
    }

    100% {
        transform: translateY(0);
    }

}


/* ================= MOBILE ================= */

@media (max-width: 400px) {

    .title {
        font-size: 35px;
    }

    .name {
        font-size: 32px;
    }

    .characters {
        transform: scale(0.88);
        margin-top: -5px;
    }

    .question {
        font-size: 21px;
        margin-top: 20px;
    }

    button {
        width: 135px;
    }
}

</style>
</head>


<body>

<div class="container">


    <!-- TITLE -->

    <h1 class="title">
        Happy Birthday,
    </h1>

    <div class="name">
        NAVI KUTTY
    </div>


    <!-- HANGING DECORATION -->

    <div class="decorations">

        <div class="string"></div>

        <div class="flag f1"></div>
        <div class="flag f2"></div>
        <div class="flag f3"></div>
        <div class="flag f4"></div>
        <div class="flag f5"></div>
        <div class="flag f6"></div>

    </div>


    <!-- CHARACTERS -->

    <div class="characters">


        <!-- BEAR -->

        <div class="bear">

            <div class="bear-ear ear1"></div>
            <div class="bear-ear ear2"></div>

            <div class="eye eye1"></div>
            <div class="eye eye2"></div>

            <div class="bear-mouth">
                ʊ
            </div>

            <div class="bear-cheek cheek1"></div>
            <div class="bear-cheek cheek2"></div>


            <!-- CAKE -->

            <div class="cake">

                <div class="flame">
                    🔥
                </div>

                <div class="candle"></div>

                <div class="cake-top"></div>

                <div class="cake-body">
                    HAPPY<br>
                    BIRTHDAY
                </div>

            </div>

        </div>


        <!-- BUNNY -->

        <div class="bunny">

            <div class="bunny-ear ear1"></div>
            <div class="bunny-ear ear2"></div>

            <div class="eye eye1"></div>
            <div class="eye eye2"></div>

            <div class="bunny-mouth">
                ʊ
            </div>

            <div class="bunny-cheek cheek1"></div>
            <div class="bunny-cheek cheek2"></div>

        </div>


    </div>


    <!-- FLOATING DECORATIONS -->

    <div class="star star1">
        ⭐
    </div>

    <div class="star star2">
        ⭐
    </div>

    <div class="flower flower1">
        🌸
    </div>

    <div class="flower flower2">
        🌼
    </div>

    <div class="heart">
        💗
    </div>


    <!-- QUESTION -->

    <div class="question">
        Are you excited for what's next?
    </div>


    <!-- BUTTONS -->

    <div class="buttons">

        <button
            class="yes"
            onclick="window.location.href='navii.html'">
            Yes
        </button>

        <button
            class="no"
            onclick="noClicked()">
            No
        </button>

    </div>


    <!-- MESSAGE -->

    <div id="message"></div>


</div>


<script>

/* YES BUTTON */

function yesClicked() {

    document.getElementById("message").innerHTML =
        "🎉 Yayyy! Something special is waiting for you! 💖";

}


/* NO BUTTON */

function noClicked() {

    document.getElementById("message").innerHTML =
        "🥺 Are you sure? Try again! 💕";

}

</script>


</body>
</html>
